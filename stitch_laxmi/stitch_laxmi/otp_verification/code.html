<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar - Contextual Suppression Check: Hidden for transactional flow -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="w-full max-w-[440px]">
<!-- Hero Graphic Section (Asymmetric Layout) -->
<div class="mb-lg flex justify-center">
<div class="relative w-32 h-32 bg-surface-container-high rounded-full flex items-center justify-center overflow-hidden shadow-sm">
<img alt="FixIt Pro Hero" class="w-16 h-16 z-10" data-alt="A clean and professional digital illustration of a smartphone displaying a large secure shield icon in the center. The background features subtle technical blueprints of electronic components in a soft blue tint. The lighting is bright and modern, creating a trustworthy and high-tech atmosphere consistent with a premium repair service application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApiNXWV1XrdlYf_EhzXBVb3e1M6P4TrxzhIkvODE8zEoJkJbgVE0IIqPl4P-3_7STxboPVJk9dJqIQ8Xcd4Ml7vXTOfHFiu5fUcULD0WKB5BacE1pNQK-EFU92cA8heHoF2Og1BeKiIH5oI4eDLVENSyPJPmz17WOaDOXlMhOx62dh8N3eI83MEfDEmApmQuAiPDbEvYzEkLyJOLnygcrjhEZUOc3xvsz8rB8ohK9WYOqRj0mHR3qLQQHJnDUeXRPfY05nqoU7Y8tG"/>
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
</div>
</div>
<!-- Content Canvas -->
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm">
<header class="mb-lg text-center">
<h1 class="font-headline-xl text-headline-xl text-primary mb-xs">Verification Code</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sent to +91 98XXX-XX210</p>
</header>
<!-- OTP Input Grid -->
<div class="grid grid-cols-6 gap-xs mb-lg">
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" type="text" value="5"/>
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" type="text" value="8"/>
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full h-touch-target text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 bg-surface transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-md active:scale-95 transition-transform flex items-center justify-center gap-base mb-md">
                    Verify &amp; Login
                    <span class="material-symbols-outlined" style="font-size: 20px;">login</span>
</button>
<!-- Footer Actions -->
<div class="flex flex-col items-center gap-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                        Didn't receive the code? 
                        <a class="text-primary font-bold hover:underline" href="#">Resend OTP</a>
</p>
<a class="font-label-sm text-label-sm text-outline flex items-center gap-xs hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
<!-- Bento-style Support Card -->
<div class="mt-lg grid grid-cols-1 gap-gutter">
<div class="bg-surface-container p-md rounded-xl flex items-center gap-md border border-white">
<div class="w-12 h-12 rounded-lg bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">support_agent</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Need help with login?</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Contact our system administrator</p>
</div>
<button class="ml-auto w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">call</span>

</div>
