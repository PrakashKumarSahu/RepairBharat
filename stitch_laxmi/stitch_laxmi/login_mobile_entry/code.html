<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Login screen: No navigation shell as per "Destination Rule" (Transactional/Linear) -->
<main class="flex-grow flex flex-col justify-between px-margin-mobile md:px-margin-desktop py-xl max-w-lg mx-auto w-full">
<!-- Header Section with Brand Identity -->
<div class="flex flex-col items-center text-center mt-xl">
<!-- Brand Logo Space -->
<div class="mb-lg">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[48px] text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">handyman</span>
</div>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary mb-xs">FixIt Pro</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Bharat Repair Logic</p>
</div>
<!-- Content Canvas -->
<div class="flex flex-col mt-xl">
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Enter your mobile number to access your workshop dashboard.</p>
</div>
<!-- Input Group -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 flex items-center pl-md pointer-events-none">
<span class="font-body-md text-body-md text-on-surface font-semibold border-r border-outline-variant pr-sm">+91</span>
</div>
<input class="w-full h-touch-target pl-[72px] pr-md bg-surface-container-lowest border border-outline rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md" id="mobile-number" name="mobile-number" placeholder="98765 43210" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant px-xs">An OTP will be sent to this number for verification.</p>
</div>
</div>
<!-- Footer Action Section -->
<div class="mt-xl pb-lg flex flex-col space-y-md">
<!-- Hero Image / Visual Anchor for Trust -->
<div class="hidden md:block w-full h-40 rounded-xl overflow-hidden mb-md">
<img alt="Professional technician environment" class="w-full h-full object-cover" data-alt="A clean and professional repair workshop environment with organized tools and high-tech equipment on a brightly lit workbench. The atmosphere is serene and orderly, reflecting a sense of technical competence and modern efficiency. The lighting is soft and high-key, aligning with a light-mode UI aesthetic. The color palette features deep tech blues and neutral whites, creating a trustworthy and stable professional atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX-Uk8fiHUq443czW701aKSlLSW0wGJJ_g6mWxSZT9V-fy5tJTj_uHObDfl4GF03yW5F0gqj7FDcsk5ZA1eWI50_Vf81ShbLa9Ayp4rC1Is74rEe3FKS0btqyQLGJ1NyRJMGDuuc-aW94EFFv2jsbV2XZrTDl4Sp4HAfc8abT12PPgagNu8Hc1egkoEc4GcFHioL-XjlI4GgUEQZOK16uHqTxFQ-y7j4oYtW2MacQF7jTD9yST-SFqPN52ctXmoAGlUrkh3pVSMxgO"/>
</div>
<button class="w-full h-touch-target bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-container active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm">
                Get OTP
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="flex items-center justify-center pt-md">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    New to FixIt Pro? 
                    <a class="text-primary font-bold hover:underline" href="#">Partner with us</a>
</p>
</div>
</div>
</main>
<!-- Visual Layer for minimalist depth -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-primary"></div>
